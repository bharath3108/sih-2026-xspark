services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # WIRE LATER: this local Qdrant is a stand-in.
    # Person 2 owns the production embedding collection.

volumes:
  qdrant_data:
